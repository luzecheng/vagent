[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vagent"
version = "0.1.0"
description = "Daily short-video agent: one Chinese script in, Chinese + English vertical videos out"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
# misaki: Chinese phonemes only (English goes through kokoro-onnx's espeak-ng), so no spaCy
dependencies = ["kokoro-onnx", "misaki[zh]", "soundfile", "numpy", "scipy", "pillow", "pyyaml", "pydantic>=2",
                "jieba", "pypinyin", "cn2an", "zhconv", "fonttools", "faster-whisper"]

[project.optional-dependencies]
youtube = ["google-api-python-client", "google-auth-oauthlib"]
test = ["pytest"]

[project.scripts]
vagent = "vagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vagent.render" = ["icons/*.svg", "icons/LICENSE"]
